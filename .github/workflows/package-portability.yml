name: Hive ledger installed-package portability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Check package entrypoint syntax
        run: |
          npm run check
          node --check test/hive-auto-ledger-cli.test.mjs
          node --check test/ledger-evidence-export.test.mjs
      - name: Test actual npm archive import outside the checkout
        run: npm run test:portable
